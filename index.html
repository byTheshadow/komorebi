<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面铺满刘海/灵动岛与底部横条下方，由 CSS 的 safe-area 负责避让 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Komorebi · 木漏</title>
    <meta name="description" content="Komorebi · 温柔的日程陪伴" />

    <!-- iOS PWA 专属：添加到主屏幕后以独立应用运行（Web Push 的前提） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Komorebi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#e0f2fe" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- 开屏第一帧：JS 还没加载完时就先出现的呼吸环（纯 CSS，无任何依赖）。
         React 的 Splash 接管后会把它移除，两者位置/尺寸一致，视觉上是同一个环。 -->
    <style>
      html, body { margin: 0; height: 100%; }
      html { background: #eef6fb; }
      #boot { position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(circle at 15% 15%, #e0f2fe 0%, #f0fdf4 38%, #f8fafc 82%); }
      #boot .ring { position: absolute; left: 50%; top: 40%; width: 92px; height: 92px; margin: -46px 0 0 -46px;
        border-radius: 50%; border: 1.5px solid rgba(2,132,199,.55); animation: boot-breath 3.2s ease-in-out infinite; }
      #boot .ring::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: #0284c7; }
      @keyframes boot-breath { 0%,100% { transform: scale(.92); opacity: .55 } 50% { transform: scale(1.06); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
